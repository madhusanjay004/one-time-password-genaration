
name: CD - Package OTP Application

on:
  workflow_run:
    workflows: ["Python application"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create ZIP package
        run: |
          zip -r otp-generator.zip . \
            -x ".git/*" \
               ".github/*" \
               ".venv/*" \
               "venv/*" \
               "__pycache__/*" \
               "*/__pycache__/*" \
               ".pytest_cache/*" \
               "*.pyc" \
               ".env" \
               ".env.*"

      - name: Upload package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: otp-generator
          path: otp-generator.zip
          if-no-files-found: error
          retention-days: 30
